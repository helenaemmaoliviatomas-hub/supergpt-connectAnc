name: Connect cross-platform verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.28.0
          pnpm install --frozen-lockfile
          rustup update stable --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Core and platform tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Frontend checks
        run: |
          pnpm test:ui
          pnpm build:web
      - name: Build production-path fixture
        run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --locked --example codex_fixture
      - name: Real Codex context and reasoning regression
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify-codex-runtime.py --download-codex
      - name: Native Windows portable build
        if: runner.os == 'Windows'
        run: pnpm build:windows
      - name: Native Apple Silicon build
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          pnpm build:macos
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            test-results/codex-runtime/
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: ignore
